version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "81:80"
    volumes:
      - results_data:/data/results
    networks:
      - open_manus_network
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - results_data:/data/results
    networks:
      - open_manus_network
    ports:
      - "8001:8000"

volumes:
  results_data:
    name: results_data

networks:
  open_manus_network:
    name: open_manus_network
    driver: bridge
