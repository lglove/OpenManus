version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "80:80"
    volumes:
      - results_data:/data/results
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - results_data:/data/results
    ports:
      - "8000:8000"

volumes:
  results_data:
    driver: local
